JavaScript版ガンマンです。<p>
<hr width=80%>

<p>

<pre id="GunClock"></pre>

<p>

<form onsubmit="return false;">
clockSize : 
<input type="text" size="2" id="clockSize" name="clockSize" value="30">
</form>

<hr width=80%>

[ <a href="../index.html">ガンマンのページへ戻る</a> ]

</center>


<script type="text/javascript" src="GunClock.js"></script>
<script type="text/javascript">
function timer01() {
  clockSize = parseInt(document.getElementById('clockSize').value)

  if ( clockSize < 17 )
    gun.innerText = "size too small"
  else
    gun.innerText = GunClock(clockSize)
}

gun = document.getElementById('GunClock')
timer01()
setInterval(timer01,1000);
</script>
